const q=t||n.p?null:D.groups.find(q=>{if(q.m!=cm)return false;const f=frm(q,n);return cx>=f.x-40&&cx<=f.x+f.w+40&&cy>=f.y-40&&cy<=f.y+f.h+40})||null;return{t,q}}
function openUrl(u){u=(u||'').trim();if(!u)return alert('Keine Web-Adresse hinterlegt.');window.open(/^[a-z][a-z0-9+.-]*:\/\//i.test(u)?u:'http://'+u,'_blank','noopener')}
const DN={bridge:'Bridge (Ports werden am Docker-Host veröffentlicht)',host:'Host-Netzwerk (nutzt direkt die Adresse des Hosts)',macvlan:'Eigene IP im Netz (macvlan oder ipvlan)'};
const upt=(n,f)=>{if(!f.up)return null;const par=nm(n.p);return(par&&(par.ifs||[]).find(i=>i.id==f.up))||(n.ifs||[]).find(i=>i.id==f.up)||null};

const ifHtml=n=>`<h2 style="margin-top:20px;font-size:14px">Schnittstellen und VLANs</h2><details class="m"><summary style="cursor:pointer">Was bedeutet Access und Trunk?</summary><p><b>Ein VLAN (Access):</b> Die Schnittstelle gehört zu genau einem Netz, das Gerät merkt nichts von VLANs. Das ist die richtige Wahl für normale PCs, Laptops, Drucker, NAS, Smart-Home-Geräte und die meisten Server, VMs und Container. Du wählst das VLAN, in dem das Gerät sitzt, oder gar keins, wenn dein Netz nicht in VLANs aufgeteilt ist.</p><p><b>Mehrere VLANs (Trunk):</b> Über dieselbe Leitung laufen mehrere Netze gleichzeitig, jedes mit einem VLAN-Tag. Das nutzt du zwischen Netzwerkgeräten (Router, Switch, Access Point) und bei Hosts, deren VMs in verschiedenen VLANs hängen, zum Beispiel Proxmox mit VLAN-fähiger Bridge.</p><p><b>Native-VLAN:</b> Beim Trunk das Netz, dessen Verkehr ohne Tag läuft. Leer lassen, wenn alle VLANs getaggt sind.</p><p>Auf einem Switch gilt dieselbe Logik pro Port. Hier trägst du ein, was am Ende der Leitung am jeweiligen Gerät eingestellt ist.</p></details>`+(n.ifs||[]).map((f,i)=>`<div class="if" data-i="${i}"><div class="r2"><input data-f="name" value="${esc(f.name)}" placeholder="Name, z. B. eno1"><select data-f="mode"><option value="access"${f.mode!='trunk'?' selected':''}>Ein VLAN (Access)</option><option value="trunk"${f.mode=='trunk'?' selected':''}>Mehrere VLANs (Trunk)</option></select><button data-x="${i}" class="dg" title="Löschen">×</button></div><p class="m" style="font-size:12px;margin:6px 0 0">${f.mode=='trunk'?'Mehrere getaggte VLANs, z. B. zwischen Switch, Router, Access Point und Host.':'Ein Netz ohne Tag. Richtig für PC, NAS, Drucker und die meisten Server.'}</p><select data-f="u">${os(D.vlans.map(v=>[v.id,'VLAN '+v.id+' '+v.name]),f.u,f.mode=='trunk'?'Kein Native-VLAN':'Kein VLAN (Standardnetz)')}</select>${f.mode=='trunk'?`<p class="m" style="font-size:12px;margin:6px 0 0">Zusätzlich getaggt:</p><div class="chips">${D.vlans.map(v=>`<label
