function exPath(a,b){if(a==b)return'Bitte zwei verschiedene Geräte wählen.';const q=[[a,[]]],seen={[a]:1};let p=null;while(q.length&&!p){const[c,h]=q.shift();if(c==b){p=h;break}D.links.forEach(l=>{const o=l.a==c?l.b:l.b==c?l.a:null;if(o&&!seen[o]){seen[o]=1;q.push([o,[...h,{l,f:c,t:o}]])}})}
if(!p)return`Zwischen ${nm(a).name} und ${nm(b).name} existiert keine Verbindung.`;
const ids=[a,...p.map(h=>h.t)],common=p.every(h=>h.l.vlans.length)?D.vlans.map(v=>v.id).filter(v=>p.every(h=>h.l.vlans.includes(v))):[],gaps=[];
p.forEach((h,i)=>{if(!h.l.pa||!h.l.pb)gaps.push(`Hop ${i+1}: Port fehlt`);if(!h.l.vlans.length)gaps.push(`Hop ${i+1}: keine VLANs angegeben`)});
return`# Netzwerkpfad: ${nm(a).name} -> ${nm(b).name}\nHops: ${p.length}\n\n## Geräte (in Pfadreihenfolge)\n${ids.map(i=>dv(nm(i))).join('\n')}\n\n## Verbindungen\n${p.map((h,i)=>`${i+1}. ${lt(h.l,h.f)}`).join('\n')}\n\n## VLANs auf allen Hops gemeinsam erlaubt\n${common.length?common.join(', '):'keine (VLAN-Übergang nur über Routing möglich oder Konfiguration prüfen)'}\n\n## Fehlende Angaben\n${gaps.join('\n')||'keine'}\n\n## Aufgabe\nPrüfe diesen Pfad auf Fehler: falsche oder fehlende VLAN-Freigaben (Trunk/Access), Port-Verwechslungen, Engpässe bei der Geschwindigkeit und Routing-Probleme.`}
function exAll(){return`# Homelab-Topologie\n\n## VLANs\n${D.vlans.map(v=>`- VLAN ${v.id} ${v.name} ${v.subnet}`).join('\n')||'-'}\n\n## Geräte\n${D.nodes.map(dv).join('\n')}\n\n## Verbindungen\n${D.links.map(l=>lt(l,l.a)).join('\n')}\n\n## Aufgabe\nPrüfe die Topologie auf Fehler und Inkonsistenzen bei VLANs, Ports und Routing.`}
function fv(){$('vf').innerHTML='<option value="">Alle VLANs</option>'+D.vlans.map(v=>`<option value="${esc(v.id)}">VLAN ${esc(v.id)} ${esc(v.name)}</option>`).join('');$('vf').value=D.vlans.some(v=>v.id==vf)?vf:(vf='')}
$('ty').innerHTML=Object.entries(TY).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('');
$('add').onclick=()=>{const n={id:uid(),name:'Neues Gerät',m:cm,type:$('ty').value,x:Math.round((200-V.x)/V.k/10)*10,y:Math.round((150-V.y)/V.k/10)*10,ip:'',url:'',info:''};D.nodes.push(n);sel=n.id;view=null;save();draw();pan()};
$('ln').onclick=()=>{mode=!mode;pend=null;$('ln').classList.toggle('on',mode);draw()};
$('vf').onchange=e=>{vf=e.target.value;draw()};$('bv').onclick=()=>{sel=null;view='vlan';draw();pan()};$('be').onclick=()=>{sel=null;view='exp';draw();pan()};
function fit(){const s=$('s').getBoundingClientRect(),a=D.nodes.filter(n=>n.m==cm),b=D.groups.filter(q=>q.m==cm);if(!a.length&&!b.length){V={x:20,y:20,k:1};return}
const x0=Math.min(...a.map(n=>n.x),...b.map(q=>q.x)),y0=Math.min(...a.map(n=>n.y),...b.map(q=>q.y)),bw=Math.max(...a.map(n=>n.x+W),...b.map(q=>q.x+q.w))-x0,bh=Math.max(...a.map(n=>n.y+H),...b.map(q=>q.y+q.h))-y0,k=Math.min(1.2,(s.width-40)/bw,(s.height-40)/bh);V={k,x:(s.width-bw*k)/2-x0*k,y:(s.height-bh*k)/2-y0*k}}
function auto(){const ns=D.nodes.filter(n=>n.m==cm);if(!ns.length)return;const ids=new Set(ns.map(n=>n.id)),ls=D.links.filter(l=>ids.has(l.a)&&ids.has(l.b)),nb=id=>ls.filter(l=>l.a==id||l.b==id).map(l=>l.a==id?l.b:l.a),lv={},rows={};
let off=0;[...ns].sort((a,b)=>(b.type=='router')-(a.type=='router')).forEach(r=>{if(lv[r.id]!=null)return;lv[r.id]=off;const q=[r.id];let mx=off;while(q.length){const c=q.shift();nb(c).forEach(o=>{if(lv[o]==null){lv[o]=lv[c]+1;mx=Math.max(mx,lv[o]);q.push(o)}})}off=mx+1});
ns.forEach(n=>(rows[lv[n.id]]=rows[lv[n.id]]||[]).push(n));
Object.keys(rows).map(Number).sort((a,b)=>a-b).forEach(L=>{const row=rows[L];row.forEach(n=>{const p=nb(n.id).map(nm).filter(o=>lv[o.id]<L&&o.px!=null);n.d=p.length?p.reduce((t,o)=>t+o.px,0)/p.length:0});row.sort((a,b)=>a.d-b.d);let x=-1e9;
row.forEach((n,i)=>{n.x=Math.round(Math.max(n.d?n.d-W/2:i*(W+50),x)/10)*10;x=n.x+W+40;n.y=L*130+40;n.px=n.x+W/2});
const ds=row.filter(n=>n.d);if(ds.length){const sh=Math.round((ds.reduce((t,n)=>t+n.d,0)/ds.length-row.reduce((t,n)=>t+n.px,0)/row.length)/10)*10;row.forEach(n=>{n.x+=sh;n.px+=sh})}});
ns.forEach(n=>{delete n.d;delete n.px});save();fit();draw();pan()}
const poll=()=>fetch('/api/status').then(r=>r.json()).then(x=>{S=x;draw()}).catch(()=>{});
$('un').onclick=undo;$('re').onclick=redo;$('au').onclick=auto;$('ft').onclick=()=>{fit();draw()};$('bl').onclick=()=>{sel=null;view='list';draw();pan()};
$('ag').onclick=()=>{const q={id:uid(),name:'Cluster',m:cm,x:Math.round((80-V.x)/V.k/10)*10,y:Math.round((80-V.y)/V.k/10)*10,w:360,h:220};D.groups.push(q);sel=q.id;view=null;save();draw();pan()};
$('mp').onchange=e=>{cm=e.target.value;sel=null;view=null;fit();draw();pan()};

$('mr').onclick=()=>{const m=D.maps.find(x=>x.id==cm),t=prompt('Neuer Name',m.name);if(!t)return;m.name=t;save();fm()};
$('md').onclick=()=>{if(D.maps.length<2)return alert('Die letzte Karte kann nicht gelöscht werden.');if(!confirm('Karte samt Geräten, Verbindungen und Gruppen löschen?'))return;const ids=D.nodes.filter(n=>n.m==cm).map(n=>n.id);D.nodes=D.nodes.filter(n=>n.m!=cm);D.links=D.links.filter(l=>!ids.includes(l.a)&&!ids.includes(l.b));D.groups=D.groups.filter(q=>q.m!=cm);D.maps=D.maps.filter(m=>m.id!=cm);mig();sel=null;save();fm();fit();draw();pan()};
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey;
if(e.key=='Delete'&&sel){const n=nm(sel),l=lk(sel),g=gp(sel);if(n){D.nodes=D.nodes.filter(x=>x!=n);D.links=D.links.filter(x=>x.a!=n.id&&x.b!=n.id)}else if(l)D.links=D.links.filter(x=>x!=l);else if(g)D.groups=D.groups.filter(x=>x!=g);sel=null;save();draw();pan()}
if(c&&k=='z'){e.preventDefault();e.shiftKey?redo():undo()}if(c&&k=='y'){e.preventDefault();redo()}});
fetch('/api/data').then(r=>r.json()).then(d=>{if(d)D=d;else{demo();save()}}).catch(()=>{demo();$('st').textContent='Server nicht erreichbar'}).finally(()=>{mig();HS=[JSON.stringify(D)];hi=0;fm();fv();fit();draw();pan();poll();setInterval(poll,30000)});
